name: trading-tick
# Every 10 minutes on weekdays during US market-adjacent hours (UTC). The engine reads the
# New York clock itself and runs whichever stage is due, once per day, so DST shifts and
# late or duplicate scheduler runs are harmless.
# Scheduling now runs on the Windows PC (see windows/). Manual runs still work here.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Force a stage (premarket | exits | close). Leave blank for normal."
        required: false
        default: ""

concurrency:
  group: trading-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-5-5' }}
      LLM_KNOWLEDGE_CUTOFF: ${{ vars.LLM_KNOWLEDGE_CUTOFF || '2026-07-01' }}
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
      # Paper only. Live trading additionally needs LIVE_CONFIRM and every audit gate passing;
      # it is deliberately NOT wired into this workflow.
      TRADING_MODE: paper
    steps:
      - name: Check secrets are set
        id: ready
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secrets not added yet (Settings > Secrets and variables > Actions). Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.ready.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Tick
        if: steps.ready.outputs.ok == 'true'
        run: |
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            python -m engine tick --stage "${{ github.event.inputs.stage }}"
          else
            python -m engine tick
          fi
